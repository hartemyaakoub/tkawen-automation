name: 📚 Wikipedia mention watcher (daily)

# Searches Wikipedia + Wikidata for fresh mentions of TKAWEN brands and writes
# the diff to a tracking log + GitHub issue. Helps the founder spot citation
# opportunities and authority signals without manual monitoring.

on:
  schedule:
    - cron: "30 5 * * *"  # 05:30 UTC daily
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Search Wikipedia for brand mentions
        id: search
        run: |
          set -e
          mkdir -p .data
          OUT=.data/wikipedia-mentions-$(date -u +%Y-%m-%d).json
          python3 scripts/wikipedia_search.py > "$OUT"
          echo "out=$OUT" >> $GITHUB_OUTPUT
          NEW_COUNT=$(jq '.new | length' "$OUT" 2>/dev/null || echo 0)
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
          jq -r '.new[]?.title' "$OUT" 2>/dev/null | head -20

      - name: Commit data file
        run: |
          git config user.email "bot@tkawen.com"
          git config user.name "TKAWEN Automation"
          git add .data/ || true
          git diff --cached --quiet || git commit -m "data: wikipedia mentions $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase origin HEAD && git push origin HEAD && break || { echo "push retry $i"; sleep 3; }; done

      - name: Notify Telegram
        if: steps.search.outputs.new_count != '0'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEW: ${{ steps.search.outputs.new_count }}
        run: |
          [ -z "$TOKEN" ] && exit 0
          MSG="📚 Wikipedia: $NEW new mentions of TKAWEN brands today — check .data/wikipedia-mentions-*.json"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT" -d text="$MSG"
