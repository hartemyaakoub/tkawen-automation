name: README promoter
permissions:
  contents: write

on:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repo:
          - hartemyaakoub/seo-toolkit
          - hartemyaakoub/mystoq-js-sdk
          - hartemyaakoub/mystoq-php-sdk
          - hartemyaakoub/mystoq-python-sdk
          - hartemyaakoub/mystoq-themes
          - hartemyaakoub/mystoq-openapi
          - hartemyaakoub/mystoq-cli
          - hartemyaakoub/mystoq-examples
          - hartemyaakoub/awesome-mystoq
          - hartemyaakoub/mystoq-mcp-server
          - hartemyaakoub/mystoq-wilayas-dataset
    steps:
      - uses: actions/checkout@v5
      - name: Refresh ecosystem footer
        env:
          GH_TOKEN: ${{ secrets.PULSE_TOKEN }}
          TARGET_REPO: ${{ matrix.repo }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then echo "PULSE_TOKEN missing"; exit 0; fi
          git clone --depth=1 "https://x-access-token:$GH_TOKEN@github.com/$TARGET_REPO.git" repo
          cd repo
          git config user.email "yaakoub.hartem.mhsi@gmail.com"
          git config user.name "Hartem Yaakoub"
          python3 "$GITHUB_WORKSPACE/scripts/readme_promoter.py"
          if git status --porcelain | grep -q .; then
            git add README.md
            git commit -m "chore: refresh TKAWEN ecosystem footer ($(date -u +%Y-%m-%d))"
            git push origin HEAD
            echo "OK $TARGET_REPO"
          else
            echo "no changes for $TARGET_REPO"
          fi
