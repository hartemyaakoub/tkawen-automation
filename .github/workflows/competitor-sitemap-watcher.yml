name: 🕵️ Competitor sitemap watcher (daily)

# Fetches competitors' sitemaps, diffs vs the previous day's snapshot, and
# alerts on new URLs. Surfaces what they're publishing so we can stay ahead.

on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC daily
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot + diff competitor sitemaps
        id: diff
        run: |
          set -e
          mkdir -p .data/competitors
          python3 scripts/competitor_sitemap_diff.py > /tmp/diff.json
          NEW=$(jq -r '.total_new' /tmp/diff.json)
          echo "new_urls=$NEW" >> $GITHUB_OUTPUT
          cp /tmp/diff.json .data/competitors/diff-$(date -u +%Y-%m-%d).json
          jq -r '.by_competitor[] | "\(.name): +\(.new | length)"' /tmp/diff.json

      - name: Commit data
        run: |
          git config user.email "bot@tkawen.com"
          git config user.name "TKAWEN Automation"
          git add .data/competitors/ || true
          git diff --cached --quiet || git commit -m "data: competitor sitemap snapshot $(date -u +%Y-%m-%d)"
          git push origin HEAD || true

      - name: Notify Telegram
        if: steps.diff.outputs.new_urls != '0'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEW: ${{ steps.diff.outputs.new_urls }}
        run: |
          [ -z "$TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT" \
            -d text="🕵️ Competitors shipped $NEW new URLs today. Check .data/competitors/"
