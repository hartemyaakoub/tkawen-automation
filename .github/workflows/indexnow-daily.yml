name: 🔍 IndexNow daily push

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC = 07:00 الجزائر
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site:
          - name: mystoq.com
            key: 9debbe6c96f1e3034e50cd28a8ca0c15
            sitemap: https://mystoq.com/sitemap.xml
          - name: liqaa.io
            key: 0de4f1a2aa4c66011b516be1ca239406
            sitemap: https://liqaa.io/sitemap.xml
          - name: algeriacertify.com
            key: c4e42e19587bf3bbef23c3a8ac0f6bae
            sitemap: https://algeriacertify.com/sitemap.xml
          - name: pharmapro.tkawen.com
            key: d809735a48e352844e028fb3478155f3
            sitemap: https://pharmapro.tkawen.com/sitemap.xml
          - name: catalogue.tkawen.com
            key: c853d03cd303883092cbb16608a90a63
            sitemap: https://catalogue.tkawen.com/sitemap.xml
          - name: tkawen.com
            key: ceb683a9c7e71b2d7ff52c4728451aa3
            sitemap: https://tkawen.com/sitemap.xml
    steps:
      - uses: actions/checkout@v5

      - name: Push to IndexNow
        if: matrix.site.key != ''
        continue-on-error: true
        run: |
          python3 scripts/indexnow_push.py \
            "${{ matrix.site.name }}" \
            "${{ matrix.site.key }}" \
            "${{ matrix.site.sitemap }}"

      - name: Skip (no key)
        if: matrix.site.key == ''
        run: echo "Skipping ${{ matrix.site.name }} — no IndexNow key configured."

  notify:
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    steps:
      - name: Telegram summary
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then echo "secrets missing, skipping"; exit 0; fi
          status="${{ needs.push.result }}"
          icon="✅"; [ "$status" != "success" ] && icon="⚠️"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${icon} IndexNow daily push — ${status}" >/dev/null
