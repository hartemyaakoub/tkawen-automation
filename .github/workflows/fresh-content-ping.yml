name: ⚡ Fresh content ping (every 4h)

# Pings Bing/Yandex IndexNow ONLY for URLs whose sitemap <lastmod> is within
# the last 48h — i.e. genuinely fresh content. The full-site daily push lives
# in indexnow-daily.yml; this one is the lightweight delta so we don't re-ping
# unchanged URLs 6× a day (which is wasteful and looks spammy to Bing).

on:
  schedule:
    - cron: "0 */4 * * *"  # every 4h
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        site:
          - name: mystoq.com
            key: 9debbe6c96f1e3034e50cd28a8ca0c15
            sitemap: https://mystoq.com/sitemap.xml
          - name: algeriacertify.com
            key: c4e42e19587bf3bbef23c3a8ac0f6bae
            sitemap: https://algeriacertify.com/sitemap.xml
          - name: tkawen.com
            key: ceb683a9c7e71b2d7ff52c4728451aa3
            sitemap: https://tkawen.com/sitemap.xml
          - name: liqaa.io
            key: 0de4f1a2aa4c66011b516be1ca239406
            sitemap: https://liqaa.io/sitemap.xml
          - name: pharmapro.tkawen.com
            key: d809735a48e352844e028fb3478155f3
            sitemap: https://pharmapro.tkawen.com/sitemap.xml
          - name: catalogue.tkawen.com
            key: c853d03cd303883092cbb16608a90a63
            sitemap: https://catalogue.tkawen.com/sitemap.xml
    steps:
      - uses: actions/checkout@v5
      - name: Ping
        if: matrix.site.key != ''
        run: |
          python3 scripts/indexnow_push.py \
            "${{ matrix.site.name }}" \
            "${{ matrix.site.key }}" \
            "${{ matrix.site.sitemap }}" \
            --since-hours 48
        continue-on-error: true
      - name: Skip (no key)
        if: matrix.site.key == ''
        run: echo "Skipping ${{ matrix.site.name }} — no IndexNow key configured."
