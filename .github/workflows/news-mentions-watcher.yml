name: 📰 News mentions watcher (daily)

# Polls Google News RSS for every TKAWEN brand keyword. Logs new articles to
# .data/news/ and Telegram-pings when fresh press shows up.

on:
  schedule:
    - cron: "0 15 * * *"  # 15:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Scan news RSS
        id: scan
        run: |
          set -e
          mkdir -p .data/news
          OUT=.data/news/mentions-$(date -u +%Y-%m-%d).json
          python3 scripts/news_mentions.py > "$OUT"
          NEW=$(jq '.summary.new_today' "$OUT")
          TOTAL=$(jq '.summary.total' "$OUT")
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          jq -r '.new[:5][]?.title' "$OUT" 2>/dev/null

      - name: Commit
        run: |
          git config user.email "bot@tkawen.com"
          git config user.name "TKAWEN Automation"
          git add .data/news/ || true
          git diff --cached --quiet || git commit -m "data: news mentions $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase origin HEAD && git push origin HEAD && break || { echo "push retry $i"; sleep 3; }; done

      - name: Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          N: ${{ steps.scan.outputs.new }}
        run: |
          [ -z "$TOKEN" ] && exit 0
          if [ -n "$N" ] && [ "$N" != "0" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="$CHAT" -d text="📰 News mentions: ${N} fresh articles about TKAWEN brands. See .data/news/"
          fi
